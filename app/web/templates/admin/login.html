{% extends "admin/base_admin.html" %}

{% block title %}Login Admin — ProjectPulse{% endblock %}

{% block admin_content %}
<div class="card" style="max-width: 440px; margin: 3rem auto; padding: 2.5rem 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Login Panel Admin</h1>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin: 0;">
            Masukkan kredensial akun administrator ProjectPulse Anda.
        </p>
    </div>

    <form method="POST" action="{{ url_for('admin.login') }}" style="display: flex; flex-direction: column; gap: 1.25rem;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div>
            <label for="username" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Nama Pengguna (Username)</label>
            <input type="text" id="username" name="username" required autofocus
                   style="width: 100%; padding: 0.6rem 0.75rem; border-radius: 6px; border: 1px solid var(--border-color); font-size: 0.95rem; box-sizing: border-box;">
        </div>

        <div>
            <label for="password" style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Kata Sandi (Password)</label>
            <input type="password" id="password" name="password" required
                   style="width: 100%; padding: 0.6rem 0.75rem; border-radius: 6px; border: 1px solid var(--border-color); font-size: 0.95rem; box-sizing: border-box;">
        </div>

        <button type="submit" class="btn btn-primary" style="padding: 0.75rem; font-size: 0.95rem; width: 100%; margin-top: 0.5rem;">
            Masuk ke Panel Admin
        </button>
    </form>
</div>
{% endblock %}
